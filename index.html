<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳氣倒數：淨零日常大作戰</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --text-color: #2c3e50; --green: #27ae60;
            --black: #34495e; --red: #c0392b; --white: #ffffff;
            --blue: #2980b9; --gold: #f39c12;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        h1, h2, h3 { margin: 0; }
        
        .screen { display: none; width: 100%; max-width: 900px; flex-direction: column; }
        .screen.active { display: flex; }

        /* --- 遊戲設置區 --- */
        .setup-container { background: var(--white); padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; margin-top: 20px; }
        .setup-row { margin: 15px 0; font-size: 18px; }
        .setup-row select { font-size: 16px; padding: 5px; margin-left: 10px; border-radius: 4px; }
        .player-setup-list { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .player-setup-item { display: flex; flex-direction: column; gap: 8px; font-size: 16px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .player-setup-header { display: flex; justify-content: space-between; align-items: center; }
        .player-setup-header select { font-size: 15px; padding: 5px; width: 60%; border-radius: 4px; }
        .role-desc-preview { font-size: 14px; color: #555; background: #e8f8f5; padding: 10px; border-radius: 4px; border-left: 4px solid var(--green); }

        /* --- 主遊戲區 --- */
        .global-stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--white); padding: 15px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid var(--black); }
        .stat-box.highlight { border-top-color: var(--green); }
        .stat-box.danger { border-top-color: var(--red); }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }

        .phase-banner { background: var(--blue); color: var(--white); text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 20px; font-weight: bold; }

        .players-zone { display: flex; gap: 10px; margin-bottom: 20px; }
        .player-card { background: var(--white); padding: 10px; border-radius: 8px; flex: 1; text-align: center; border: 2px solid #bdc3c7; opacity: 0.6; transition: 0.3s; }
        .player-card.active { border-color: var(--green); opacity: 1; box-shadow: 0 0 10px rgba(39, 174, 96, 0.5); transform: scale(1.05); background: #e8f8f5; }
        .player-role { font-weight: bold; font-size: 16px; margin-bottom: 5px; color: var(--blue); }
        .player-resources { font-size: 14px; color: #555; }

        .action-area { background: var(--white); padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 250px; }
        
        /* 專屬技能面板 */
        .skill-panel { background: #eafaf1; border: 2px dashed var(--green); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .skill-info h4 { margin: 0 0 5px 0; color: var(--green); font-size: 18px; }
        .skill-info p { margin: 0; font-size: 14px; color: #555; }

        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .card { border: 1px solid #bdc3c7; border-radius: 8px; padding: 15px; background: #fafafa; }
        .card h4 { color: var(--blue); margin-bottom: 10px; }
        .card-details { font-size: 13px; color: #555; margin-bottom: 10px; min-height: 40px; }
        
        .btn { background: #ecf0f1; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; color: var(--text-color); font-size: 15px; }
        .btn.full { width: 100%; margin-bottom: 5px; }
        .btn:hover:not(:disabled) { background: #d0d3d4; }
        .btn-primary { background: var(--green); color: white; }
        .btn-primary:hover:not(:disabled) { background: #219653; }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover:not(:disabled) { background: #a93226; }
        .btn-special { background: var(--gold); color: white; }
        .btn-special:hover:not(:disabled) { background: #d68910; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }
        .btn-pulse { animation: pulse-green 1.5s infinite; background: var(--green); color: white; }

        .special-actions { display: flex; flex-direction: column; gap: 5px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; }

        .tokens-display { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .token { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; font-size: 14px; animation: popIn 0.3s ease-out forwards; opacity: 0; transform: scale(0); }
        .token.black { background: #111; border: 2px solid #555; border-radius: 8px; }
        .token.green { background: var(--green); border: 2px solid #a8e6cf; border-radius: 50%; }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }

        /* --- 彈出確認視窗 --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; max-width: 450px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: slideDown 0.3s ease-out; }
        .modal-title { font-size: 22px; font-weight: bold; color: var(--blue); margin-bottom: 15px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;}
        .modal-content { font-size: 16px; margin-bottom: 20px; line-height: 1.6; text-align: left; }
        .change-val { font-weight: bold; }
        .change-val.pos { color: var(--green); }
        .change-val.neg { color: var(--red); }
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="setup-screen" class="screen active">
        <h1 style="text-align:center; color: var(--green); margin-bottom: 5px;">《碳氣倒數：淨零日常》</h1>
        <p style="text-align:center; color:#7f8c8d;">多人合作線上測試版</p>
        
        <div class="setup-container">
            <h2>創建遊戲房間與職業選擇</h2>
            <div class="setup-row">
                <label>請選擇遊玩人數：</label>
                <select id="select-player-count" onchange="generateRoleSelects()">
                    <option value="2">2 人</option>
                    <option value="3">3 人</option>
                    <option value="4" selected>4 人</option>
                </select>
            </div>
            
            <div id="role-setup-container" class="player-setup-list">
                </div>
            
            <button class="btn btn-primary" style="font-size: 18px; padding: 12px 30px; margin-top: 10px;" onclick="startGame()">確認職業並開始遊戲</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="global-stats">
            <div class="stat-box"><div>當前回合</div><div class="stat-value" id="ui-round">1 / 6</div></div>
            <div class="stat-box danger"><div>暖化指數 (>=10崩潰)</div><div class="stat-value" id="ui-warming">2 級</div></div>
            <div class="stat-box highlight"><div>幸福度 (<=0暴動)</div><div class="stat-value" id="ui-happiness">80%</div></div>
            <div class="stat-box"><div>大氣層現況</div>
                <div class="stat-value" style="font-size: 18px; margin-top: 10px;">⚫ <span id="ui-bag-black">10</span> | 🟢 <span id="ui-bag-green">15</span></div>
            </div>
        </div>

        <div class="phase-banner" id="ui-phase-banner">準備開始遊戲</div>
        <div class="players-zone" id="ui-players"></div>
        <div class="action-area" id="ui-action-area"></div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">階段結算</div>
            <div class="modal-content" id="modal-content"></div>
            <button class="btn btn-primary full" id="modal-btn" onclick="closeModal()">確認並繼續</button>
        </div>
    </div>

<script>
    // --- 完整資料庫 (包含專屬技能設定) ---
    const ALL_ROLES = [
        { 
            name: '永續設計師', coins: 3, id: 'designer',
            skillName: 'LCA源頭減碳', apCost: 1, coinCost: 1, 
            skillDesc: '花費 1 AP 與 1 綠幣：精準設計，永久移除大氣層 1 顆黑碳。' 
        },
        { 
            name: '環保局長', coins: 5, id: 'director',
            skillName: '動用綠色預算', apCost: 1, coinCost: 2, 
            skillDesc: '花費 1 AP 與 2 綠幣：推動政策，增加 2 顆綠氧並提升 5% 幸福度。' 
        },
        { 
            name: '綠色採購員', coins: 2, id: 'purchaser',
            skillName: '4R極致省錢', apCost: 1, coinCost: 0, 
            skillDesc: '花費 1 AP：捨棄便利以換取資源，不花錢獲得 2 綠幣，但下降 5% 幸福度。' 
        },
        { 
            name: '社區主委', coins: 4, id: 'leader',
            skillName: '安撫民心', apCost: 1, coinCost: 1, 
            skillDesc: '花費 1 AP 與 1 綠幣：舉辦社區大會，大幅提升 15% 居民幸福度。' 
        },
        { 
            name: '碳盤查顧問', coins: 3, id: 'consultant',
            skillName: '出售碳權報告', apCost: 1, coinCost: 0, 
            skillDesc: '花費 1 AP：進行企業盤查專案，直接賺取 3 枚綠幣。' 
        }
    ];

    const ACTION_CARDS = [
        { name: '頂級和牛大餐', cost: 0, black: 3, green: 0, hap: 15, rmBlack: 0, desc: '幸福+15%，袋中增加 3 黑碳' },
        { name: '汰換 LED 節能燈', cost: 4, black: 1, green: 3, hap: 0, rmBlack: 0, desc: '建置+1 黑碳，長期帶來 +3 綠氧' },
        { name: '大眾運輸推廣', cost: 1, black: 0, green: 2, hap: -5, rmBlack: 0, desc: '幸福-5%，袋中增加 2 綠氧' },
        { name: '強制減碳政策', cost: 2, black: 0, green: 0, hap: -15, rmBlack: 2, desc: '民怨(幸福-15%)，移除 2 黑碳' },
        { name: '太陽能微電網', cost: 5, black: 1, green: 4, hap: 10, rmBlack: 0, desc: '建置+1 黑碳，幸福+10%，增 4 綠氧' },
        { name: '快時尚折扣狂歡', cost: 0, black: 4, green: 0, hap: 20, rmBlack: 0, desc: '幸福+20%，袋中暴增 4 黑碳' }
    ];

    const EVENTS = [
        { name: '超級熱浪襲來', text: '居民狂吹冷氣，強制增加 4 顆黑碳！', black: 4, hap: 0, coins: 0 },
        { name: '短延時強降雨', text: '社區淹水，居民幸福度瞬間 -15%！', black: 0, hap: -15, coins: 0 },
        { name: '國際綠色補貼', text: '獲得外部支援，全體玩家獲得 1 綠幣！', black: 0, hap: 0, coins: 1 },
    ];

    let state = {};
    let turnChanges = {}; 
    let modalCallback = null;

    function fmtVal(val, invertGoodBad = false) {
        if (val === 0) return '0';
        let prefix = val > 0 ? '+' : '';
        let isPos = invertGoodBad ? (val < 0) : (val > 0);
        return `<span class="change-val ${isPos ? 'pos' : 'neg'}">${prefix}${val}</span>`;
    }

    // ================= 1. 遊戲設置階段 (支援預覽技能) =================
    
    function generateRoleSelects() {
        const count = parseInt(document.getElementById('select-player-count').value);
        const container = document.getElementById('role-setup-container');
        container.innerHTML = '';
        
        for(let i=0; i<count; i++) {
            container.innerHTML += `
                <div class="player-setup-item">
                    <div class="player-setup-header">
                        <label><b>玩家 ${i+1}</b> 職業：</label>
                        <select class="role-select" id="setup-p${i}-role" onchange="updateRoleUniqueness()"></select>
                    </div>
                    <div id="setup-p${i}-desc" class="role-desc-preview"></div>
                </div>
            `;
        }
        
        const selects = document.querySelectorAll('.role-select');
        selects.forEach((sel, index) => {
            sel.innerHTML = ALL_ROLES.map((r, idx) => `<option value="${idx}">${r.name} (初始 ${r.coins} 幣)</option>`).join('');
            sel.selectedIndex = index % ALL_ROLES.length; 
        });
        updateRoleUniqueness();
    }

    function updateRoleUniqueness() {
        const selects = Array.from(document.querySelectorAll('.role-select'));
        const selectedValues = selects.map(sel => sel.value);

        selects.forEach((sel, i) => {
            let currentValue = sel.value;
            // 更新技能預覽文字
            let roleInfo = ALL_ROLES[currentValue];
            document.getElementById(`setup-p${i}-desc`).innerHTML = `<b>特技 [${roleInfo.skillName}]：</b>${roleInfo.skillDesc}`;

            Array.from(sel.options).forEach(opt => {
                if (selectedValues.includes(opt.value) && opt.value !== currentValue) {
                    opt.disabled = true;
                    opt.text = ALL_ROLES[opt.value].name + " (已被選取)";
                } else {
                    opt.disabled = false;
                    opt.text = ALL_ROLES[opt.value].name + ` (初始 ${ALL_ROLES[opt.value].coins} 幣)`;
                }
            });
        });
    }

    window.onload = () => { generateRoleSelects(); };

    function startGame() {
        const selects = document.querySelectorAll('.role-select');
        let selectedPlayers = [];
        selects.forEach((sel, i) => {
            let r = ALL_ROLES[sel.value];
            selectedPlayers.push({
                id: i, name: `玩家 ${i+1}`, role: r.name, ap: 0, coins: r.coins, skillUsed: false
            });
        });

        state = {
            round: 1, maxRound: 6, phase: 1,
            warming: 2, happiness: 80, bag: { black: 10, green: 15 },
            players: selectedPlayers, startPlayerIndex: 0, currentPlayerIndex: 0, playersDone: 0,
            market: [], currentEvent: null
        };

        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        startRound();
    }

    // ================= 2. 彈窗與結算系統 =================
    function showModal(title, contentHtml, onConfirmCallback) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-content').innerHTML = contentHtml;
        modalCallback = onConfirmCallback;
        document.getElementById('modal-overlay').classList.add('active');
    }
    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('active');
        if (modalCallback) { let cb = modalCallback; modalCallback = null; cb(); }
    }

    // ================= 3. 核心遊戲流程 =================
    function render() {
        document.getElementById('ui-round').innerText = `${state.round} / ${state.maxRound}`;
        document.getElementById('ui-warming').innerText = `${state.warming} 級`;
        document.getElementById('ui-happiness').innerText = `${state.happiness}%`;
        document.getElementById('ui-bag-black').innerText = state.bag.black;
        document.getElementById('ui-bag-green').innerText = state.bag.green;

        const playersZone = document.getElementById('ui-players');
        playersZone.innerHTML = state.players.map((p, index) => {
            let isActive = (state.phase === 2 && index === state.currentPlayerIndex);
            return `
                <div class="player-card ${isActive ? 'active' : ''}">
                    <div style="font-size:12px; color:#7f8c8d;">${p.name}</div>
                    <div class="player-role">${p.role}</div>
                    <div class="player-resources">AP: <b style="color:${isActive && p.ap===0 ? 'var(--red)' : 'inherit'}">${p.ap}</b> | 綠幣: <b>${p.coins}</b></div>
                </div>
            `;
        }).join('');

        const banner = document.getElementById('ui-phase-banner');
        const actionArea = document.getElementById('ui-action-area');
        
        if (state.phase === 2) {
            let cp = state.players[state.currentPlayerIndex];
            let roleData = ALL_ROLES.find(r => r.name === cp.role);
            banner.innerText = `階段二：日常行動 (${cp.name} - ${cp.role} 的回合)`;
            
            // 特技發動面板
            let skillBtnState = (cp.ap < roleData.apCost || cp.coins < roleData.coinCost || cp.skillUsed) ? 'disabled' : '';
            let skillBtnText = cp.skillUsed ? '本回合已發動' : `發動特技 (耗 ${roleData.apCost}AP ${roleData.coinCost}幣)`;
            
            let skillHtml = `
                <div class="skill-panel">
                    <div class="skill-info">
                        <h4>⭐ 特技：${roleData.skillName}</h4>
                        <p>${roleData.skillDesc}</p>
                    </div>
                    <button class="btn btn-special" style="padding:15px; width:160px;" ${skillBtnState} onclick="useSkill()">${skillBtnText}</button>
                </div>
            `;

            let marketHtml = state.market.map((c, i) => `
                <div class="card">
                    <h4>${c.name}</h4>
                    <div class="card-details">成本: ${c.cost} 綠幣<br>${c.desc}</div>
                    <button class="btn btn-primary full" ${cp.ap<1 || cp.coins<c.cost ? 'disabled':''} onclick="buyCard(${i})">購買/執行 (1 AP)</button>
                </div>
            `).join('');

            let isApEmpty = (cp.ap <= 0);
            let endBtnClass = isApEmpty ? "btn btn-pulse full" : "btn full";
            let endBtnText = isApEmpty ? "行動值已耗盡，點擊確認結束回合" : "保留 AP，提前結束我的回合";
            let endBtnStyle = isApEmpty ? "" : "background:#bdc3c7;";

            actionArea.innerHTML = `
                ${skillHtml}
                <h3>中央市場 (目前剩餘：${cp.ap} AP)</h3>
                <div class="market-grid">${marketHtml}</div>
                <div class="special-actions">
                    <button class="btn full" ${cp.ap<1 || cp.coins<1 ? 'disabled':''} onclick="shareResource()">轉贈1綠幣給下家 (1 AP)</button>
                    <button class="btn btn-danger full" ${cp.ap<2 || cp.coins<3 ? 'disabled':''} onclick="publicVote()">推動公投換牌 (2 AP, 3幣)</button>
                    <button class="${endBtnClass}" style="${endBtnStyle}" onclick="processEndTurn()">${endBtnText}</button>
                </div>
            `;
        }
        else if (state.phase === 3) {
            banner.innerText = "階段三：大氣盲抽結算階段";
            actionArea.innerHTML = `
                <div style="text-align:center;">
                    <h3>大氣層的真實審判</h3>
                    <p>公式計算：基礎 3 顆 + 當前暖化 ${state.warming} 級 = 必須盲抽 <b>${3 + state.warming}</b> 顆</p>
                    <button class="btn btn-danger" id="btn-draw" style="padding:15px 30px; font-size:18px;" onclick="startDrawPhase()">開始盲抽</button>
                    <div id="draw-results" class="tokens-display"></div>
                </div>
            `;
        }
    }

    function resetTurnChanges() { turnChanges = { black: 0, green: 0, hap: 0, coinsSpent: 0, cardsPlayed: [] }; }

    function startRound() {
        state.players.forEach(p => { p.ap = 2; p.skillUsed = false; });
        state.playersDone = 0; state.currentPlayerIndex = state.startPlayerIndex; state.phase = 1;
        state.currentEvent = EVENTS[Math.floor(Math.random() * EVENTS.length)];
        
        state.bag.black += state.currentEvent.black; state.happiness += state.currentEvent.hap;
        if(state.currentEvent.coins > 0) state.players.forEach(p => p.coins += state.currentEvent.coins);
        render(); 

        let content = `
            <p><b>事件描述：</b>${state.currentEvent.text}</p>
            <ul>
                <li>大氣層黑碳增加：${fmtVal(state.currentEvent.black, true)}</li>
                <li>居民幸福度變動：${fmtVal(state.currentEvent.hap)}%</li>
                <li>全體獲得補給：${fmtVal(state.currentEvent.coins)} 綠幣</li>
            </ul>
        `;
        showModal(`⛈️ 氣候事件：${state.currentEvent.name}`, content, () => {
            refreshMarket(); state.phase = 2; resetTurnChanges(); render(); 
        });
    }

    function refreshMarket() { state.market = Array.from({length: 4}, () => ACTION_CARDS[Math.floor(Math.random() * ACTION_CARDS.length)]); }

    // --- 發動專屬特技邏輯 ---
    function useSkill() {
        let cp = state.players[state.currentPlayerIndex];
        let r = ALL_ROLES.find(role => role.name === cp.role);
        
        cp.ap -= r.apCost;
        cp.coins -= r.coinCost;
        cp.skillUsed = true;
        
        // 特技實際效果
        if (r.id === 'designer') {
            state.bag.black = Math.max(0, state.bag.black - 1);
            turnChanges.black -= 1;
        } else if (r.id === 'director') {
            state.bag.green += 2; turnChanges.green += 2;
            state.happiness += 5; turnChanges.hap += 5;
        } else if (r.id === 'purchaser') {
            cp.coins += 2; turnChanges.coinsSpent -= 2; // 賺錢
            state.happiness -= 5; turnChanges.hap -= 5;
        } else if (r.id === 'leader') {
            state.happiness += 15; turnChanges.hap += 15;
        } else if (r.id === 'consultant') {
            cp.coins += 3; turnChanges.coinsSpent -= 3;
        }

        turnChanges.cardsPlayed.push(`🌟發動特技：${r.skillName}`);
        turnChanges.coinsSpent += r.coinCost;
        render(); // 更新畫面，等待玩家下一步
    }

    function buyCard(idx) {
        let cp = state.players[state.currentPlayerIndex]; let c = state.market[idx];
        cp.ap -= 1; cp.coins -= c.cost;
        state.bag.black += c.black; state.bag.green += c.green; state.happiness += c.hap;
        if(c.rmBlack > 0) state.bag.black = Math.max(0, state.bag.black - c.rmBlack);
        
        turnChanges.cardsPlayed.push(c.name); turnChanges.coinsSpent += c.cost;
        turnChanges.black += (c.black - c.rmBlack); turnChanges.green += c.green; turnChanges.hap += c.hap;
        state.market[idx] = ACTION_CARDS[Math.floor(Math.random() * ACTION_CARDS.length)];
        render(); 
    }

    function shareResource() {
        let cp = state.players[state.currentPlayerIndex]; let nextIdx = (state.currentPlayerIndex + 1) % state.players.length;
        cp.ap -= 1; cp.coins -= 1; state.players[nextIdx].coins += 1;
        turnChanges.cardsPlayed.push(`轉贈1幣給${state.players[nextIdx].name}`); turnChanges.coinsSpent += 1;
        render();
    }

    function publicVote() {
        let cp = state.players[state.currentPlayerIndex]; cp.ap -= 2; cp.coins -= 3;
        turnChanges.cardsPlayed.push('推動社區公投'); turnChanges.coinsSpent += 3; refreshMarket(); render();
    }

    function processEndTurn() {
        let cp = state.players[state.currentPlayerIndex];
        let actionList = turnChanges.cardsPlayed.length > 0 ? turnChanges.cardsPlayed.join('<br> • ') : '無動作 (棄權)';
        
        let content = `
            <p><b>本回合執行的行動：</b><br> • ${actionList}</p>
            <p><b>數值總結：</b></p>
            <ul>
                <li>資金變動：${fmtVal(-turnChanges.coinsSpent)} 綠幣</li>
                <li>大氣層變化：黑碳 ${fmtVal(turnChanges.black, true)} | 綠氧 ${fmtVal(turnChanges.green)}</li>
                <li>居民幸福度：${fmtVal(turnChanges.hap)}%</li>
            </ul>
        `;

        showModal(`✅ ${cp.name} (${cp.role}) 結算確認`, content, () => {
            state.playersDone++;
            if (state.playersDone >= state.players.length) {
                state.phase = 3; render();
            } else {
                state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
                resetTurnChanges(); render(); 
            }
        });
    }

    // --- 盲抽與維護階段維持不變 ---
    async function startDrawPhase() {
        document.getElementById('btn-draw').style.display = 'none';
        const displayZone = document.getElementById('draw-results');
        
        let drawCount = 3 + state.warming; let cBag = [];
        for(let i=0; i<state.bag.black; i++) cBag.push('black');
        for(let i=0; i<state.bag.green; i++) cBag.push('green');
        cBag.sort(() => Math.random() - 0.5);

        let dBlack = 0, dGreen = 0;
        for(let i=0; i<drawCount; i++) {
            if(cBag.length === 0) break;
            let type = cBag.pop(); type === 'black' ? dBlack++ : dGreen++;
            let el = document.createElement('div'); el.className = `token ${type}`; el.innerText = type==='black'?'碳':'氧';
            displayZone.appendChild(el);
            await new Promise(r => setTimeout(r, 400));
        }
        await new Promise(r => setTimeout(r, 600));

        let warmChange = 0, resText = "";
        if (dBlack > dGreen) {
            warmChange = 1; state.warming += 1;
            resText = `<span style="color:var(--red);font-weight:bold;">糟糕！污染擴散，暖化指數上升！</span>`;
        } else {
            warmChange = -1; state.warming = Math.max(0, state.warming - 1);
            resText = `<span style="color:var(--green);font-weight:bold;">成功防堵！綠氧壓制，暖化指數下降！</span>`;
        }

        let content = `
            <p>本次總計盲抽了 <b>${dBlack + dGreen}</b> 顆大氣標記。</p>
            <ul><li>抽出黑碳：<b>${dBlack}</b> 顆</li><li>抽出綠氧：<b>${dGreen}</b> 顆</li></ul>
            <p>${resText}</p>
            <p><b>暖化指數變動：</b> ${fmtVal(warmChange, true)} 級 (目前 ${state.warming} 級)</p>
            <p style="color:#7f8c8d; font-size:13px;">*所有標記已退回大氣層中持續累積。</p>
        `;

        showModal(`🌪️ 盲抽結果與氣候審判`, content, () => {
            checkGameOver();
            if(state.warming < 10) processCleanupPhase();
        });
    }

    function processCleanupPhase() {
        state.phase = 4; state.players.forEach(p => p.coins += 2); render();
        let content = `
            <p>政府發放基礎營運補給：</p>
            <ul><li>全體玩家：${fmtVal(2)} 綠幣</li></ul>
            <p>即將進入第 ${state.round + 1} 回合...</p>
        `;
        showModal(`🧹 維護與重置階段`, content, () => {
            state.round++; state.startPlayerIndex = (state.startPlayerIndex + 1) % state.players.length;
            if (state.round > state.maxRound) checkGameOver(true);
            else startRound();
        });
    }

    function checkGameOver(forceEnd = false) {
        if (state.happiness > 100) state.happiness = 100;
        let title = "", content = "";
        if (state.warming >= 10) { title = "💥 遊戲失敗：氣候崩潰"; content = "暖化指數突破 10 級，極端災難毀滅社區。"; } 
        else if (state.happiness <= 0) { title = "💥 遊戲失敗：社會暴動"; content = "居民幸福度歸零，社會秩序瓦解。"; } 
        else if (forceEnd) {
            if (state.warming <= 0 && state.happiness > 0) { title = "🎉 遊戲勝利：淨零達成！"; content = "成功撐過 6 回合並達成 Net Zero！"; } 
            else { title = "⌛ 遊戲結束：轉型失敗"; content = `撐過了 6 回合，但暖化指數仍有 ${state.warming} 級。`; }
        }
        if (title !== "") showModal(title, content, () => { location.reload(); });
    }
</script>
